[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrocouple"
dynamic = ["version"]
description = "Python interface definitions for the HydroCouple component-based modeling framework"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Caleb Buahin"},
]
dependencies = [
    "numpy>=1.21",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/HydroCouple/HydroCouple"

[tool.setuptools.packages.find]
include = ["hydrocouple*", "_hydrocouple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
