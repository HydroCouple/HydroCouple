name: Release Wheels

# Builds the `hydrocouple` Python package for every supported platform and
# publishes it to PyPI when a version tag is pushed. A manual run builds and
# uploads the artifacts without publishing.
#
# Publishing uses PyPI trusted publishing: the PyPI project `hydrocouple` must
# list this repository, this workflow file and the `pypi` environment as a
# trusted publisher. No API token is stored.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each architecture; macOS builds x86_64 and arm64
        # (see [tool.cibuildwheel] in python/pyproject.toml).
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: python
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        # setup.py's sdist step vendors the interface headers and the version,
        # so the sdist builds a wheel without the repository around it.
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist python --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [ wheels, sdist ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hydrocouple
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
