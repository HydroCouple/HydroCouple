name: Build and Unit Test

on:
  push:
    branches: [ "master", "dev"]
  pull_request:
    branches: [ "master"]

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: "${{ github.workspace }}/vcpkg"
  VCPKG_EXE:  "${{ github.workspace }}/vcpkg/vcpkg"
  NUGET_FEED_URL: https://nuget.pkg.github.com/HydroCouple/index.json
  NUGET_USER_NAME: ${{ secrets.NUGET_USER_NAME }}
  NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/HydroCouple/index.json,readwrite"

jobs:
  build_and_unit_test:
    name: Build and Unit Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            alias: Linux
            shell: bash
            preset_alias: linux
            shell_extension: .sh
            vcpkg_triplet: x64-linux

          - os: macos-latest
            alias: apple-silicon
            preset_alias: macos
            shell: bash
            shell_extension: .sh
            vcpkg_triplet: arm64-osx

          - os: windows-latest
            alias: win64
            preset_alias: windows
            shell: cmd
            shell_extension: .bat
            vcpkg_triplet: x64-windows
    permissions: write-all

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: HydroCouple

      - name: Checkout VCPKG
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          # Keep in step with the other HydroCouple projects. Old vcpkg
          # releases stop working over time rather than staying frozen:
          # their vcpkg_acquire_msys.cmake pins exact MSYS2 package
          # versions, and MSYS2 mirrors serve only current packages, so
          # every mirror eventually 404s on the pinned msys2-runtime and
          # any port calling vcpkg_fixup_pkgconfig (gtest included) fails
          # to build on Windows.
          ref: 2026.07.29
          path: vcpkg

      - name: Bootstrap VCPKG (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg.bat
          vcpkg.exe integrate install

      - name: Bootstrap VCPKG (Unix like)
        if: ${{ matrix.os != 'windows-latest' }}
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_extension }}
          chmod +x vcpkg

      - name: Install Mono (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Install Mono (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: brew install mono

      - name: Install VCPKG Dependencies
        working-directory: HydroCouple
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: ${{ env.VCPKG_EXE }} install --triplet=${{ matrix.vcpkg_triplet }}

      - name: Install NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 5.x

      - name: Install NuGet (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          .$(vcpkg fetch nuget) sources add -Name github -Source ${{ env.NUGET_FEED_URL }} -UserName ${{ env.NUGET_USER_NAME }} -Password ${{ env.NUGET_API_KEY }}
          .$(vcpkg fetch nuget) setapikey ${{ env.NUGET_API_KEY }} -Source github
          .$(vcpkg fetch nuget) sources

      - name: Configure NuGet (Unix like)
        if: ${{ matrix.os != 'windows-latest' }}
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          mono `./vcpkg fetch nuget | tail -n 1` sources add -Name github -Source ${{ env.NUGET_FEED_URL }} -UserName ${{ env.NUGET_USER_NAME }} -Password ${{ env.NUGET_API_KEY }} 
          mono `./vcpkg fetch nuget | tail -n 1` setapikey ${{ env.NUGET_API_KEY }} -Source github 
          mono `./vcpkg fetch nuget | tail -n 1` sources

      - name: CMake Configure and Build
        working-directory: HydroCouple
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          cmake -B ${{github.workspace}}/build-${{ matrix.vcpkg_triplet }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake -DHYDROCOUPLE_BUILD_TESTS=ON
          cmake --build ${{github.workspace}}/build-${{ matrix.vcpkg_triplet }} --config ${{env.BUILD_TYPE}}

      - name: Run Unit Tests
        working-directory: ${{github.workspace}}/build-${{ matrix.vcpkg_triplet }}
        run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

  # The Python bindings restate the headers — enum values in
  # hydrocouple/core.py and _hydrocouple/_core.pxd, and the ABC layer's
  # method surface. Nothing in the compiler checks that restatement, so
  # tests/test_enum_parity.py parses the headers and compares. It only
  # helps if it runs: the WorkflowStatus renumbering shipped with the
  # bindings silently mapping C++ Validating onto Python Updating, and
  # this suite would have caught it the day it landed.
  #
  # The extension is built rather than assumed: 38 of the 98 tests drive
  # the compiled Cython layer, and they pass vacuously against a stale
  # .so. Building from source takes ~30 s.
  python_bindings:
    name: Python Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and test dependencies
        working-directory: python
        run: python -m pip install --upgrade pip "Cython>=3.0" "numpy>=1.21" "setuptools>=64" pytest

      - name: Build Cython extension in place
        working-directory: python
        run: python setup.py build_ext --inplace

      - name: Run Python test suite
        working-directory: python
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q
