name: Documentation

# Builds and co-deploys both documentation sites, mirroring the
# openswmm.engine documentation pipeline:
#
#     /          Doxygen C++ interface docs (site root)
#     /python/   Sphinx Python bindings docs
#
# The Doxygen navbar links to python/index.html (docs/DoxygenLayout.xml)
# and the Sphinx navbar links back to ../index.html (python/docs/conf.py),
# so the two sites cross-reference each other when co-deployed.

on:
  push:
    branches: [ "master", "dev" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'docs/**'
      - 'python/docs/**'
      - 'python/hydrocouple/**'
      - 'include/**'
      - '**/*.md'
      - '.github/workflows/build_docs.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'docs/**'
      - 'python/docs/**'
      - 'python/hydrocouple/**'
      - 'include/**'
      - '**/*.md'
      - '.github/workflows/build_docs.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_python_docs:
    name: Build Python Docs (Sphinx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        # python/docs/requirements.txt is the single source of truth;
        # numpy is needed because hydrocouple.helpers imports it.
        run: |
          pip install -r python/docs/requirements.txt
          pip install numpy

      - name: Build Sphinx docs
        run: sphinx-build -b html -W --keep-going python/docs python/docs/_build/html

      - name: Upload Python docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-docs
          path: python/docs/_build/html/
          retention-days: 1

  build_doxygen_docs:
    name: Build C++ Docs (Doxygen)
    needs: build_python_docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget tar

      - name: Install Doxygen 1.13.2
        # Pinned to match docs/DoxygenLayout.xml (generated by 1.13.2),
        # same as the openswmm.engine pipeline.
        run: |
          wget -q https://github.com/doxygen/doxygen/releases/download/Release_1_13_2/doxygen-1.13.2.linux.bin.tar.gz
          tar -xzf doxygen-1.13.2.linux.bin.tar.gz
          sudo cp doxygen-1.13.2/bin/doxygen /usr/local/bin/
          doxygen --version

      - name: Build Doxygen docs
        working-directory: docs
        run: |
          doxygen Doxyfile
          cp CNAME html/

      - name: Upload Doxygen docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: docs/html/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: [build_python_docs, build_doxygen_docs]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Doxygen docs (site root)
        uses: actions/download-artifact@v4
        with:
          name: doxygen-docs
          path: site/

      - name: Download Python docs (site/python)
        uses: actions/download-artifact@v4
        with:
          name: python-docs
          path: site/python/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
